[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
baseRadius = "large"
baseFontSize = 15
showWidgetBorder = true
font = "sans-serif"

[theme.light]
primaryColor = "#0f766e"
backgroundColor = "#f1f5f4"
secondaryBackgroundColor = "#ffffff"
textColor = "#14302b"

[theme.dark]
primaryColor = "#2dd4bf"
backgroundColor = "#0e1514"
secondaryBackgroundColor = "#17211f"
textColor = "#e6f0ed"
